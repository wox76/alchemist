<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemist: Il Duello dei Grimori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=12">
</head>

<body>
    <div id="title-screen">
        <div class="title-content">
            <div class="mode-buttons">
                <button id="btn-1p" class="start-button">⚔️ DUE GIOCATORI</button>
                <button id="btn-cpu" class="start-button">🤖 GIOCATORE VS CPU</button>
            </div>
        </div>
        <div class="title-glow"></div>
        <div class="particles-container"></div>
    </div>

    <div id="game-container" class="hidden">
        <!-- Player 2 (Top) -->
        <div id="player-2" class="player-zone">
            <div class="player-info">
                <span class="player-name">Mago 2</span>
                <div class="hp-bar-container">
                    <div id="p2-hp-bar" class="hp-bar" style="width: 100%;"></div>
                    <span id="p2-hp-text" class="hp-text">40 / 40</span>
                </div>
                <!-- Added shield display -->
                <div id="p2-shield-container" class="shield-container hidden">
                    <span class="shield-icon">🛡️</span>
                    <span id="p2-shield-text">0</span>
                </div>
            </div>
            <div id="p2-grimoire" class="grimoire">
                <div class="slot" data-index="0"></div>
                <div class="slot" data-index="1"></div>
                <div class="slot" data-index="2"></div>
                <div class="slot" data-index="3"></div>
                <div class="slot" data-index="4"></div>
            </div>
        </div>

        <!-- Middle Area -->
        <div id="middle-zone">
            <!-- Altar (Left) -->
            <div id="altar-container">
                <h3>Altare</h3>
                <div id="altar" class="altar">
                    <div class="altar-slot" data-index="0"></div>
                    <div class="altar-slot" data-index="1"></div>
                    <div class="altar-slot" data-index="2"></div>
                    <div class="altar-slot" data-index="3"></div>
                    <div class="altar-slot" data-index="4"></div>
                </div>
            </div>

            <!-- Crucible (Center) -->
            <div id="crucible-container">
                <div id="crucible" class="grid-5x5">
                    <!-- Grid cells will be generated by JS -->
                </div>
            </div>

            <!-- Log/Status (Right) -->
            <div id="game-log-container">
                <h3>Log di Gioco</h3>
                <div id="game-log"></div>
                <div id="options-bar" onclick="openSettings()">⚙️ OPZIONI DI GIOCO</div>
            </div>
        </div>

        <!-- Player 1 (Bottom) -->
        <div id="player-1" class="player-zone active-turn">
            <div id="p1-grimoire" class="grimoire">
                <div class="slot" data-index="0"></div>
                <div class="slot" data-index="1"></div>
                <div class="slot" data-index="2"></div>
                <div class="slot" data-index="3"></div>
                <div class="slot" data-index="4"></div>
            </div>
            <div class="player-info">
                <span class="player-name">Mago 1</span>
                <div class="hp-bar-container">
                    <div id="p1-hp-bar" class="hp-bar" style="width: 100%;"></div>
                    <span id="p1-hp-text" class="hp-text">40 / 40</span>
                </div>
                <!-- Added shield display -->
                <div id="p1-shield-container" class="shield-container hidden">
                    <span class="shield-icon">🛡️</span>
                    <span id="p1-shield-text">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- UI Overlays -->
    <div id="turn-announcement" class="hidden"></div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Impostazioni di Gioco</h3>
            <div class="setting-item">
                <label>Volume Musica</label>
                <input type="range" id="music-volume" min="0" max="100" value="15">
                <span id="music-vol-value">15%</span>
            </div>
            <div class="setting-item">
                <label>Volume Effetti (SFX)</label>
                <input type="range" id="sfx-volume" min="0" max="100" value="50">
                <span id="sfx-vol-value">50%</span>
            </div>
            <button class="close-modal" onclick="closeSettings()">CHIUDI</button>
        </div>
    </div>

    <script type="module" src="js/main.js?v=26"></script>
</body>


</html>

</html>
